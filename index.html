<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f1115'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%234ade80'%3E%F0%9F%8F%8B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Gym Tracker</title>
<style>
:root{
  --bg:#0f1115; --card:#1a1d24; --card2:#232733; --line:#2c3140;
  --txt:#e8eaf0; --mut:#8b93a7; --acc:#4ade80; --acc2:#22c55e;
  --warn:#fbbf24; --blue:#60a5fa; --red:#f87171; --rad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;-webkit-text-size-adjust:100%}
body{padding:0 0 78px}
body.logging{padding-bottom:132px}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 2px 2px;font-weight:700}
h2{font-size:16px;margin:18px 2px 6px;font-weight:700}
h3{font-size:17px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin:0 2px 12px}
.note{color:var(--mut);font-size:12.5px;line-height:1.5;display:block;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:inherit;font-size:15px;border:none;border-radius:10px;
  padding:11px 14px;background:var(--card2);color:var(--txt);cursor:pointer;
  transition:.12s;font-weight:600}
button:active{transform:scale(.97)}
.split-btn{flex:1;min-width:84px;text-align:center;border:1.5px solid var(--line)}
.split-btn.on{background:var(--acc);color:#06210f;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);
  padding:14px;margin:10px 0}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exname{font-size:17px;font-weight:700;line-height:1.2}
.eqp{display:inline-block;font-size:11px;color:var(--mut);background:var(--card2);
  border-radius:6px;padding:2px 7px;margin-top:5px;font-weight:600;letter-spacing:.3px}
.last{color:var(--mut);font-size:12.5px;margin-top:8px;line-height:1.5}
.rec{margin-top:10px;background:var(--card2);border-radius:10px;padding:10px 11px}
.rec-h{font-size:11px;letter-spacing:.6px;color:var(--acc);font-weight:700;text-transform:uppercase}
.setline{display:flex;align-items:center;gap:7px;margin-top:8px}
.setlabel{font-size:12px;color:var(--mut);width:42px;flex:none;cursor:pointer;
  border-radius:6px;padding:4px 2px;text-align:center;border:1px solid transparent}
.setlabel.done{color:#06210f;background:var(--acc);border-color:var(--acc);font-weight:700}
.inp{flex:1;min-width:0;background:var(--bg);border:1.5px solid var(--line);
  color:var(--txt);border-radius:9px;padding:10px;font-size:16px;text-align:center;font-weight:600}
.inp:focus{outline:none;border-color:var(--acc)}
.unit{font-size:11px;color:var(--mut);width:22px;flex:none}
.setdel{flex:none;width:34px;padding:8px 0;background:var(--card);border:1px solid var(--line);
  color:var(--red);font-size:17px;line-height:1;border-radius:8px}
.movebtns{display:flex;gap:5px;flex:none}
.movebtns .mini{padding:6px 9px;font-size:12px}
.why{font-size:11.5px;color:var(--warn);margin-top:8px;line-height:1.4}
.mini{padding:7px 10px;font-size:13px;background:var(--card2);border:1px solid var(--line)}
.mini.alt{color:var(--blue)}
.acts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.acts button{flex:1;min-width:90px}
.pick{padding:6px 0}
.pick .exname{font-size:15px}
.pickrow{display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);padding:11px 2px;cursor:pointer}
.pickrow:active{background:var(--card2)}
.tag{font-size:11px;color:var(--mut);text-align:right;flex:none}
.add{width:100%;margin-top:6px;background:transparent;border:1.5px dashed var(--line);color:var(--mut)}
.field{width:100%;background:var(--bg);border:1.5px solid var(--line);color:var(--txt);
  border-radius:9px;padding:10px;font-size:15px;font-family:inherit}
textarea.field{min-height:60px;resize:vertical}
.go{background:var(--acc);color:#06210f}
.ghost{background:var(--card2)}
.danger{background:transparent;border:1.5px solid var(--red);color:var(--red)}
.kpi{display:flex;gap:8px;margin:6px 0}
.kpibox{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpibox .n{font-size:20px;font-weight:800}
.kpibox .l{font-size:11px;color:var(--mut);margin-top:2px}
.chart{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:3px 9px;
  background:rgba(74,222,128,.15);color:var(--acc);margin-left:6px}
.pill.gray{background:var(--card2);color:var(--mut)}
select.field{appearance:none}
.hsess{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.hhead{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.hbody{margin-top:8px;font-size:13px;color:var(--mut);line-height:1.7;display:none}
.hbody.on{display:block}
.hbody b{color:var(--txt);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:#13161d;border-top:1px solid var(--line);
  z-index:20}
.nav{display:flex;max-width:560px;margin:0 auto}
.nav button{flex:1;background:transparent;border:none;border-radius:0;padding:9px 4px 8px;
  color:var(--mut);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .ic{font-size:19px;line-height:1}
.nav button.on{color:var(--acc)}
.actionbar{position:fixed;left:0;right:0;bottom:56px;max-width:560px;margin:0 auto;
  padding:9px 14px;display:flex;gap:8px;background:linear-gradient(180deg,transparent,#0f1115 30%)}
.actionbar button{flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;z-index:40;align-items:flex-end}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;
  padding:16px;max-height:86vh;overflow:auto}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;background:var(--card2);border:1px solid var(--line)}
.seg button.on{background:var(--acc);color:#06210f;border-color:var(--acc)}
textarea#exp{width:100%;min-height:200px;background:var(--bg);color:var(--txt);border:1px solid var(--line);
  border-radius:9px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);
  background:var(--acc);color:#06210f;padding:10px 18px;border-radius:30px;font-weight:700;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--mut);font-size:14px;padding:20px 2px;text-align:center}
.screen{display:none}
.screen.on{display:block}
label.lbl{font-size:12px;color:var(--mut);display:block;margin:10px 2px 4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="screen on" id="s-log">
    <h1>Gym Tracker</h1>
    <div class="sub" id="logsub">Pick today's split to start.</div>
    <div class="row" id="splits"></div>
    <div id="list"></div>
    <div id="sessnotes"></div>
  </div>

  <div class="screen" id="s-hist">
    <h1>History</h1>
    <div class="sub" id="histsub"></div>
    <div class="row" style="margin-bottom:8px">
      <button class="split-btn on" id="hf-all" onclick="setHistFilter('all')">All</button>
      <button class="split-btn" id="hf-Upper" onclick="setHistFilter('Upper')">Upper</button>
      <button class="split-btn" id="hf-Lower" onclick="setHistFilter('Lower')">Lower</button>
    </div>
    <div id="histlist"></div>
  </div>

  <div class="screen" id="s-back">
    <h1>Backup &amp; Sync</h1>
    <div class="sub">Your data lives on this device. Export keeps it safe and gets sessions into your spreadsheet.</div>
    <div id="backbody"></div>
  </div>
</div>

<div class="actionbar" id="actionbar" style="display:none">
  <button class="ghost" onclick="discardSession()">Discard</button>
  <button class="go" onclick="finishSession()">Finish &amp; save</button>
</div>

<div class="bar"><div class="nav" id="nav">
  <button class="on" data-s="log" onclick="tab('log')"><span class="ic">&#128221;</span>Log</button>
  <button data-s="hist" onclick="tab('hist')"><span class="ic">&#128336;</span>History</button>
  <button data-s="back" onclick="tab('back')"><span class="ic">&#9729;</span>Backup</button>
</div></div>

<div class="modal" id="modal"><div class="sheet" id="sheetc"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= storage ================= */
const KEY='gym.store.v2';
const EQUIP_INC={Barbell:5,Dumbbell:2,Machine:2.5,Cable:2.5,Bodyweight:0};
const $=id=>document.getElementById(id);
let DB=loadDB();
if(!DB.hidden)DB.hidden={Upper:[],Lower:[]};
let CAT=null;              // derived catalog cache
let active=DB.active||null;
let split=active?active.split:null;
let histFilter='all';
function touch(){if(active)active.dirty=true}

function loadDB(){
  try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.history)return v}catch(e){}
  // first run: seed
  const hist={Upper:[],Lower:[]};
  ['Upper','Lower'].forEach(sp=>{
    (SEED.history[sp]||[]).forEach(s=>hist[sp].push(
      {date:s.date,split:sp,exercises:s.exercises.map(cloneEx),notes:'',synced:true,src:'seed'}));
  });
  return {history:hist,bodyweight:[],hidden:{Upper:[],Lower:[]},active:null,seededAt:SEED.generated};
}
function cloneEx(e){return {name:e.name,equipment:e.equipment,
  sets:(e.sets||[]).map(s=>({reps:s.reps,weight:s.weight})),remarks:e.remarks||''}}
function saveDB(){DB.active=active;localStorage.setItem(KEY,JSON.stringify(DB));CAT=null}
function num(v){return (v===''||v==null)?null:(isNaN(+v)?v:+v)}
function today(){return new Date().toLocaleDateString('en-CA')}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1500)}

/* ================= catalog (derived from history) ================= */
function median(a){if(!a.length)return null;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;
  return b.length%2?b[m]:(b[m-1]+b[m])/2}
function q(a,p){if(!a.length)return null;const b=[...a].sort((x,y)=>x-y);
  const i=Math.min(b.length-1,Math.max(0,Math.round(p*(b.length-1))));return b[i]}
const LADDER=[1.25,2,2.5,5,7.5,10],CAP={Barbell:10,Dumbbell:4,Machine:10,Cable:5,Bodyweight:0};
function snapInc(inc,eq){if(eq==='Bodyweight')return 0;const c=CAP[eq]||10;inc=Math.min(inc,c);
  return LADDER.reduce((a,b)=>Math.abs(b-inc)<Math.abs(a-inc)?b:a)}
function topWeight(ex){const w=ex.sets.map(s=>s.weight).filter(x=>typeof x==='number');return w.length?Math.max(...w):null}

function buildCatalog(){
  const cat={Upper:{},Lower:{}};
  ['Upper','Lower'].forEach(sp=>{
    const byname={}; const sessions=DB.history[sp];
    // oldest-first appearances
    for(let k=sessions.length-1;k>=0;k--){
      sessions[k].exercises.forEach(ex=>{(byname[ex.name]=byname[ex.name]||[]).push({ex,date:sessions[k].date})});
    }
    // newest-first for latest info
    const latest={};
    sessions.forEach(s=>s.exercises.forEach(ex=>{if(!latest[ex.name])latest[ex.name]={equipment:ex.equipment,lastSets:ex.sets,lastDate:s.date}}));
    Object.keys(byname).forEach(name=>{
      const apps=byname[name],reps=[],ceilSig=[],floorSig=[],deltas=[];let prev=null;
      apps.forEach(a=>{
        const rp=a.ex.sets.map(s=>s.reps).filter(x=>typeof x==='number');
        rp.forEach(r=>reps.push(r));
        const tw=topWeight(a.ex);
        if(prev&&tw!=null&&prev.tw!=null){const d=+(tw-prev.tw).toFixed(2);
          if(d>0){deltas.push(d);if(prev.rp.length)ceilSig.push(Math.max(...prev.rp));if(rp.length)floorSig.push(Math.min(...rp))}}
        prev={tw,rp};
      });
      let floor,ceiling;
      if(ceilSig.length&&floorSig.length){ceiling=Math.round(median(ceilSig));floor=Math.round(median(floorSig))}
      else if(reps.length){floor=Math.round(q(reps,.25));ceiling=Math.round(q(reps,.75))}
      else{floor=6;ceiling=10}
      floor=Math.max(3,Math.min(floor,15));ceiling=Math.max(floor+1,Math.min(ceiling,25));
      const eq=latest[name].equipment; let inc=EQUIP_INC[eq]!=null?EQUIP_INC[eq]:2.5;
      const rd=deltas.map(d=>Math.round(d*4)/4).filter(d=>d>0&&d<=20);
      if(rd.length>=3){const c={};rd.forEach(d=>c[d]=(c[d]||0)+1);
        let best=null,bc=0;Object.keys(c).forEach(k=>{if(c[k]>bc){bc=c[k];best=+k}});
        if(bc>=2)inc=best;}
      inc=snapInc(inc,eq);
      cat[sp][name]={name,equipment:eq,count:apps.length,lastDate:latest[name].lastDate,
        lastSets:latest[name].lastSets,floor,ceiling,inc};
    });
  });
  return cat;
}
function catalog(){if(!CAT)CAT=buildCatalog();return CAT}
function catFor(sp,includeHidden){let a=Object.values(catalog()[sp]);if(!includeHidden){const h=DB.hidden[sp]||[];a=a.filter(e=>h.indexOf(e.name)<0)}return a.sort((a,b)=>b.count-a.count)}
function lookup(sp,name){return catalog()[sp][name]}
function lookupAny(name){let f=null;['Upper','Lower'].forEach(sp=>{const x=catalog()[sp][name];
  if(x&&(!f||x.lastDate>f.lastDate))f=x});return f}

/* ================= movement patterns / recs ================= */
function pattern(n){n=n.toLowerCase();
  if(/(pulldown|pull-up|pull up|pullover)/.test(n))return'vertical_pull';
  if(/row/.test(n))return'horizontal_row';
  if(/(pec deck|fly|crossover)/.test(n)&&!/reverse/.test(n))return'chest_fly';
  if(/(reverse pec|reverse crossover|face pull)/.test(n))return'rear_delt';
  if(/(lateral raise|y-raise|y raise)/.test(n))return'side_delt';
  if(/(front raise|upright row)/.test(n))return'front_delt';
  if(/(shoulder press|overhead press)/.test(n))return'shoulder_press';
  if(/(bench|chest press|incline press|decline|dip|push up|push-up|close-grip press|wide chest)/.test(n))return'chest_press';
  if(/(tricep|press-down|pressdown|pushdown|kickback)/.test(n))return'triceps';
  if(/curl/.test(n)&&!/leg|lying|wrist|forearm/.test(n))return'biceps';
  if(/(squat|leg press|hack)/.test(n))return'quad_compound';
  if(/(deadlift|dead lift|rdl|romanian|stiff leg|sumo)/.test(n))return'hip_hinge';
  if(/hip thrust/.test(n))return'glute';
  if(/(leg curl|lying curl)/.test(n))return'hamstring';
  if(/leg extension/.test(n))return'quad_iso';
  if(/calf/.test(n))return'calf';
  if(/(abductor|adductor)/.test(n))return'hip_iso';
  if(/(crunch|abdominal|ab crunch|leg raise|hip flexor)/.test(n))return'core';
  if(/shrug/.test(n))return'traps';
  if(/(wrist|forearm)/.test(n))return'forearm';
  if(/(swing)/.test(n))return'hinge_power';
  if(/(jump|pogo|depth|plyo)/.test(n))return'plyo';
  return'other';}
const CURATED={
 chest_press:['Bench Press','Incline Press','Chest Press','Dips','Wide Chest Press'],
 chest_fly:['Pec Deck','Pec Fly','Decline Fly'],
 vertical_pull:['Lat Pulldown','Pull-Up','Lat Pullover'],
 horizontal_row:['Low Row','Chest-Supported Row','Pulley Row'],
 biceps:['Bayesian Curl','Preacher Curl','Incline Curl','Hammer Curl'],
 triceps:['Tricep Press-down','Overhead Tricep Extension','Tricep Kickback'],
 side_delt:['Seated Lateral Raise','Cross Body Y-Raise'],
 rear_delt:['Reverse Pec Deck','Reverse Crossover','Face Pull'],
 front_delt:['Front Raise','Upright Row'],
 shoulder_press:['Shoulder Press'],
 quad_compound:['Hack Squat','Leg Press','Back Squat'],
 hip_hinge:['Romanian Dead Lift','Stiff Leg RDL'],
 glute:['Hip Thrust'],hamstring:['Leg Curl'],quad_iso:['Leg Extension'],
 calf:['Calf Raise','Bent-Leg Calf Raise'],hip_iso:['Hip Abductor','Adductor'],
 core:['Ab Crunch','Total Abdominal','Leg Raise']};
function orderRank(n){const p=pattern(n);const R={plyo:1,hinge_power:2,
  quad_compound:3,hip_hinge:3,chest_press:3,vertical_pull:3,horizontal_row:3,shoulder_press:3,
  glute:4,hamstring:4,quad_iso:4,chest_fly:5,side_delt:5,rear_delt:5,front_delt:5,biceps:5,triceps:5,traps:5,hip_iso:5,
  calf:6,core:6,forearm:6,other:5};return R[p]||5}

function recommend(sp,name){
  const c=lookup(sp,name)||lookupAny(name);
  if(!c)return{sets:[{reps:6,weight:''}],why:'New exercise \u2013 pick a comfortable weight.'};
  const inc=c.inc, bw=c.equipment==='Bodyweight';
  const sets=c.lastSets.map(s=>{let lr=num(s.reps),lw=s.weight;
    if(bw||lw==='-'||lw==null||isNaN(+lw))return{reps:(typeof lr==='number'?lr+1:lr),weight:(lw==='-'?'-':lw)};
    lw=+lw;
    if(typeof lr==='number'&&lr>=c.ceiling)return{reps:c.floor,weight:+(lw+inc).toFixed(2)};
    if(typeof lr==='number')return{reps:lr+1,weight:lw};
    return{reps:lr,weight:lw};});
  const hit=c.lastSets.some(s=>num(s.reps)>=c.ceiling);
  const why=bw?'Bodyweight \u2013 add 1 rep per set vs last time ('+c.lastDate+').'
    :hit?'Hit '+c.ceiling+'+ reps last time \u2192 +'+inc+'kg, reset to '+c.floor+' reps.'
        :'Under '+c.ceiling+' reps last time \u2192 same weight, chase +1 rep (target '+c.floor+'\u2013'+c.ceiling+').';
  return{sets,why,date:c.lastDate,win:c.floor+'\u2013'+c.ceiling};
}

function allExerciseNames(){const s=new Set();['Upper','Lower'].forEach(sp=>DB.history[sp].forEach(se=>se.exercises.forEach(e=>s.add(e.name))));

function est1RM(reps,w){return (typeof reps==='number'&&typeof w==='number'&&w>0)?w*(1+reps/30):null}
function renderProgress(){
  // bodyweight
  const bw=DB.bodyweight||[];const cur=bw.length?bw[bw.length-1]:null;

function addBW(){const v=parseFloat($('bwin').value);if(!v){toast('Enter a number');return}

function renderExProgress(){
  const name=$('exsel').value;if(!name){$('progbody').innerHTML='';return}
  const ss=exSessions(name);
  let bestW=null,bestWrec='',best1=null,best1rec='',bestVol=null;
  ss.forEach(s=>{let vol=0;s.ex.sets.forEach(st=>{
    const w=typeof st.weight==='number'?st.weight:null,r=typeof st.reps==='number'?st.reps:null;
    if(w!=null){if(bestW==null||w>bestW){bestW=w;bestWrec=(r||'?')+'\u00d7'+w+' \u00b7 '+s.date}}
    const e=est1RM(r,w);if(e!=null&&(best1==null||e>best1)){best1=e;best1rec=s.date}
    if(w!=null&&r!=null)vol+=w*r;});
    if(vol>0&&(bestVol==null||vol>bestVol))bestVol=vol;});
  // trend series: top-set est1RM (fallback top weight) per session
  const series=ss.map((s,i)=>{let best=null;s.ex.sets.forEach(st=>{
    const e=est1RM(typeof st.reps==='number'?st.reps:null,typeof st.weight==='number'?st.weight:null);
    const v=e!=null?e:(typeof st.weight==='number'?st.weight:null);if(v!=null&&(best==null||v>best))best=v});
    return best==null?null:{x:i,y:+best.toFixed(1),date:s.date}}).filter(Boolean);
  const c=lookupAny(name);
  let h='<div class="kpi"><div class="kpibox"><div class="n">'+(bestW!=null?bestW+'kg':'\u2013')+'</div><div class="l">best set \u00b7 '+(bestWrec||'')+'</div></div></div>'+
    '<div class="kpi"><div class="kpibox"><div class="n">'+(best1!=null?Math.round(best1)+'kg':'\u2013')+'</div><div class="l">est. 1RM'+(best1rec?' \u00b7 '+best1rec:'')+'</div></div>'+
    '<div class="kpibox"><div class="n">'+ss.length+'</div><div class="l">sessions'+(c?' \u00b7 target '+c.floor+'\u2013'+c.ceiling:'')+'</div></div></div>';
  h+=series.length>1?spark(series,'est 1RM (kg)'):'<div class="empty">Not enough data to chart yet.</div>';
  h+='<h2>Recent sessions</h2>';
  [...ss].reverse().slice(0,12).forEach(s=>{h+='<div class="hsess"><div class="hhead"><b>'+s.date+'</b><span class="tag">'+
    s.ex.sets.map(st=>(st.reps==null?'-':st.reps)+'\u00d7'+(st.weight==null?'-':st.weight)).join('  ')+'</span></div>'+
    (s.ex.remarks?'<div class="hbody on">'+s.ex.remarks+'</div>':'')+'</div>'});
  $('progbody').innerHTML=h;
}
function spark(pts,label){
  if(pts.length<2)return'';
  const W=520,H=120,pad=24;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  const sx=x=>pad+(xmax===xmin?0.5:(x-xmin)/(xmax-xmin))*(W-2*pad);
  const sy=y=>H-pad-(ymax===ymin?0.5:(y-ymin)/(ymax-ymin))*(H-2*pad);
  const d=pts.map((p,i)=>(i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1)).join(' ');
  const dots=pts.map(p=>'<circle cx="'+sx(p.x).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'" r="2.4" fill="#4ade80"/>').join('');
  const first=pts[0].y,lastY=pts[pts.length-1].y,up=lastY>=first;
  return '<div class="chart"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut)">'+
    '<span>'+label+'</span><span style="color:'+(up?'var(--acc)':'var(--red)')+'">'+
    (up?'\u2197 ':'\u2198 ')+first+' \u2192 '+lastY+'</span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="none" style="margin-top:6px">'+
    '<path d="'+d+'" fill="none" stroke="#4ade80" stroke-width="2"/>'+dots+
    '<text x="'+pad+'" y="12" fill="#8b93a7" font-size="11">'+ymax+'</text>'+
    '<text x="'+pad+'" y="'+(H-6)+'" fill="#8b93a7" font-size="11">'+ymin+'</text></svg></div>';
}

   '<div class="kpibox"><div class="n" style="color:'+(u?'var(--warn)':'var(--acc)')+'">'+u+'</div><div class="l">not yet in spreadsheet</div></div></div>'+
   '<h2>Get sessions into your spreadsheet</h2>'+
   '<small class="note">Tap below, then send the text to Claude with \u201csync my gym log\u201d. Claude appends them into Gym Schedule.xlsx (Upper/Lower). Then mark them synced.</small>'+
   '<button class="go" style="width:100%" onclick="openExport()">Copy '+(u||'')+' session'+(u===1?'':'s')+' for Claude</button>'+
   '<button class="ghost" style="width:100%;margin-top:8px" onclick="markSynced()">Mark all as synced</button>'+
   '<h2>Full backup</h2>'+
   '<small class="note">Saves everything (history, bodyweight, notes) to a file. Keep it somewhere safe \u2013 your data lives only on this device.</small>'+
   '<button class="ghost" style="width:100%" onclick="exportBackup()">\u2b07 Download full backup (.json)</button>'+
   '<label class="lbl">Restore from a backup file (merges, no duplicates)</label>'+
   '<input type="file" accept="application/json" class="field" onchange="importBackup(this.files[0])">'+
   '<h2>Install on your phone</h2>'+
   '<small class="note">Chrome menu (\u22ee) \u2192 <b>Add to Home screen</b>. It opens full-screen like an app and works offline.</small>'+
   '<h2 style="color:var(--red)">Danger zone</h2>'+
   '<button class="danger" style="width:100%" onclick="resetAll()">Reset app to spreadsheet seed</button>';
}
function fmtSession(s){
  const read=s.date+'  ('+s.split+')\n'+s.exercises.map(e=>{
    const sets=e.sets.map(st=>(st.reps==null?'-':st.reps)+'x'+(st.weight==null?'-':st.weight)).join('  ');
    return '  '+e.name+' ['+(e.equipment||'-')+']: '+sets+(e.remarks?'  // '+e.remarks:'')}).join('\n')+
    (s.notes?'\n  notes: '+s.notes:'');
  return read;
}
function openExport(one){
  const list=one?[one]:unsynced();
  const readable=list.length?list.map(fmtSession).join('\n\n'):'(nothing new to sync)';
  const jsonObj=list.map(s=>({date:s.date,split:s.split,notes:s.notes||'',
    exercises:s.exercises.map(e=>({name:e.name,equipment:e.equipment,sets:e.sets,remarks:e.remarks||''}))}));
  const js=JSON.stringify(jsonObj,null,1);
  window._exp={r:readable,j:js};
  let h='<h3>Send to Claude</h3><small class="note">Append to Gym Schedule.xlsx (Upper\u2192Upper sheet, Lower\u2192Lower sheet). Say: \u201csync my gym log\u201d.</small>'+
   '<div class="seg"><button class="on" id="t-r" onclick="seg(\'r\')">Readable</button><button id="t-j" onclick="seg(\'j\')">JSON</button></div>'+
   '<textarea id="exp">'+readable.replace(/</g,'&lt;')+'</textarea>'+
   '<div class="acts"><button class="go" onclick="copyExp()">Copy</button><button class="ghost" onclick="closeModal()">Close</button></div>';
  showModal(h);
}
function seg(m){$('t-r').className=m==='r'?'on':'';$('t-j').className=m==='j'?'on':'';$('exp').value=(m==='r'?window._exp.r:window._exp.j)}
function copyExp(){const t=$('exp');t.select();const done=()=>toast('Copied \u2013 paste to Claude');
  if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(done,()=>{document.execCommand('copy');done()});
  else{document.execCommand('copy');done()}}
function markSynced(){let n=0;['Upper','Lower'].forEach(sp=>DB.history[sp].forEach(s=>{if(s.src==='app'&&!s.synced){s.synced=true;n++}}));
  saveDB();renderBackup();toast(n+' marked synced')}
function exportBackup(){const blob=new Blob([JSON.stringify(DB)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gym-backup-'+today()+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup downloaded')}
function importBackup(file){if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);mergeImport(d)}catch(e){toast('Could not read file')}};r.readAsText(file)}
function mergeImport(d){
  if(d.history){let added=0;['Upper','Lower'].forEach(sp=>{(d.history[sp]||[]).forEach(s=>{
    if(!DB.history[sp].some(x=>x.date===s.date&&x.exercises.length===s.exercises.length)){DB.history[sp].push(s);added++}});
    DB.history[sp].sort((a,b)=>a.date<b.date?1:-1);});
    if(d.bodyweight)d.bodyweight.forEach(b=>{if(!DB.bodyweight.some(x=>x.date===b.date&&x.kg===b.kg))DB.bodyweight.push(b)});
    DB.bodyweight.sort((a,b)=>a.date<b.date?-1:1);
    saveDB();renderBackup();toast('Imported '+added+' new sessions')}
  else toast('Not a valid backup')}
function resetAll(){askConfirm('Reset wipes app-logged sessions and reloads the spreadsheet seed. Export a backup first! Continue?',()=>{
  localStorage.removeItem(KEY);DB=loadDB();if(!DB.hidden)DB.hidden={Upper:[],Lower:[]};active=null;split=null;CAT=null;
  renderSplits();renderList();renderNotes();renderBackup();$('actionbar').style.display='none';toast('Reset to seed')},'Reset')}

/* ================= modal ================= */
function showModal(h){$('sheetc').innerHTML=h;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
function askConfirm(msg,onYes,yesLabel,onCancel){window._cy=onYes;window._cn=onCancel||null;
  const h='<h3>'+(yesLabel||'Confirm')+'?</h3><small class="note">'+String(msg).replace(/</g,'&lt;')+'</small>'+
    '<div class="acts"><button class="ghost" onclick="_confCancel()">Cancel</button>'+
    '<button class="go" onclick="_confYes()">'+(yesLabel||'Yes')+'</button></div>';showModal(h)}
function _confYes(){const f=window._cy;window._cy=window._cn=null;closeModal();if(f)f()}
function _confCancel(){const f=window._cn;window._cy=window._cn=null;closeModal();if(f)f()}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ================= boot ================= */
renderSplits();
if(active&&active.split){split=active.split;renderList();renderNotes();$('actionbar').style.display='flex';document.body.classList.add('logging');}
else renderList();
</script>
</body>
</html>
